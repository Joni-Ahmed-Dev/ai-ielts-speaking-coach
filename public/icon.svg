<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Outer background circle/squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="480" height="480" x="16" y="16" rx="96" fill="none" stroke="#27272a" stroke-width="4" />
  
  <!-- Subtle halo glow -->
  <circle cx="256" cy="240" r="140" fill="url(#accent)" />

  <!-- Stylized Microphone Body -->
  <rect x="208" y="110" width="96" height="170" rx="48" fill="url(#gold)" />
  
  <!-- Microphone Acoustic Grid Lines -->
  <line x1="220" y1="170" x2="292" y2="170" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
  <line x1="220" y1="200" x2="292" y2="200" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
  <line x1="220" y1="230" x2="292" y2="230" stroke="#78350f" stroke-width="4" stroke-linecap="round" />

  <!-- Microphone Cradle / Arc -->
  <path d="M 160 210 C 160 310, 352 310, 352 210" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" />

  <!-- Stand & Base -->
  <line x1="256" y1="310" x2="256" y2="390" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" />
  <rect x="176" y="390" width="160" height="20" rx="10" fill="url(#gold)" />

  <!-- Voice wave pulses -->
  <circle cx="256" cy="240" r="180" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="12 16" opacity="0.6" />
</svg>
