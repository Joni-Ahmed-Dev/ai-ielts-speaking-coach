name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli
      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK dir: $SDK"
          ls "$SDK"
          if [ ! -e "$SDK/tools" ] && [ ! -e "$SDK/bin" ] && [ -d "$SDK/cmdline-tools/latest" ]; then
            ln -s "$SDK/cmdline-tools/latest" "$SDK/tools"
          fi
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$SDK" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
      - name: Build APK with Bubblewrap
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ieltscoach123
          BUBBLEWRAP_KEY_PASSWORD: ieltscoach123
        run: printf 'y\n%.0s' {1..10} | bubblewrap build --manifest=./twa-manifest.json --skipPwaValidation
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IELTS-Coach-APK
          path: app-release-signed.apk
          if-no-files-found: error
